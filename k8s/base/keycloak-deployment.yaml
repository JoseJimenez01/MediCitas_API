apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.0.8
        args:
        - start-dev
        - --import-realm
        ports:
        - name: http
          containerPort: 8080
        - name: management
          containerPort: 9000
        env:
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: restaurant-secrets
              key: KC_BOOTSTRAP_ADMIN_USERNAME
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: restaurant-secrets
              key: KC_BOOTSTRAP_ADMIN_PASSWORD
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL
          valueFrom:
            configMapKeyRef:
              name: restaurant-config
              key: KC_DB_URL
        - name: KC_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: restaurant-secrets
              key: POSTGRES_USER
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: restaurant-secrets
              key: POSTGRES_PASSWORD
        - name: KC_CACHE
          value: local
        - name: KC_HTTP_ENABLED
          value: 'true'
        - name: KC_HOSTNAME
          value: http://keycloak:8080
        - name: KC_HOSTNAME_STRICT
          value: 'false'
        - name: KC_HEALTH_ENABLED
          value: 'true'
        - name: KC_METRICS_ENABLED
          value: 'true'
        - name: K6_WRITER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: restaurant-secrets
              key: K6_WRITER_PASSWORD
        - name: K6_READER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: restaurant-secrets
              key: K6_READER_PASSWORD
        - name: MED_TEST_PASSWORD
          valueFrom:
            secretKeyRef:
              name: restaurant-secrets
              key: MED_TEST_PASSWORD
        - name: MED_ADMIN_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: restaurant-secrets
              key: MED_ADMIN_CLIENT_SECRET
        volumeMounts:
        - name: realm-template
          mountPath: /opt/keycloak/data/import
          readOnly: true
        startupProbe:
          httpGet:
            path: /health/started
            port: management
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health/ready
            port: management
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /health/live
            port: management
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
      initContainers:
      - name: wait-for-postgres
        image: postgres:16-alpine
        command:
        - sh
        - -ec
        - until pg_isready -h postgres -U "$POSTGRES_USER" -d keycloakdb; do sleep
          2; done
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: restaurant-secrets
              key: POSTGRES_USER
      volumes:
      - name: realm-template
        configMap:
          name: keycloak-realm-template
